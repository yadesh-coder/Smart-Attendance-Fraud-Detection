name: Deploy Static Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'github-pages-demo/**'
      - '.github/workflows/github-pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Demo Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'github-pages-demo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
