server.port=8082
spring.application.name=auth-service

# Real MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_auth_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nathiya06}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# JWT Configuration
jwt.secret=${JWT_SECRET:smart_attendance_fraud_detection_jwt_secret_key_32bytes_minimum}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Seed Configuration
initial.admin.email=${INITIAL_ADMIN_EMAIL:admin@college.edu}
initial.admin.password=${INITIAL_ADMIN_PASSWORD:admin123}
